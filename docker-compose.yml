  pocketbase:
    image: alpine:latest
    container_name: pocketbase
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_public:/pb/pb_public # Опционально для статики
    environment:
      # Версия должна соответствовать JS SDK (js/db-interface.js загружает
      # pocketbase@0.26.8): формат realtime-подписок changed в PB 0.23+,
      # на 0.22 realtime-подписка из SDK 0.26 не работает.
      - PB_VERSION=0.26.1
    dirname: /pb
    working_dir: /pb
    command: >
      sh -c "
      if [ ! -f pocketbase ]; then
        wget https://github.com/pocketbase/pocketbase/releases/download/v$$PB_VERSION/pocketbase_$${PB_VERSION}_linux_amd64.zip &&
        unzip pocketbase_$${PB_VERSION}_linux_amd64.zip &&
        rm pocketbase_$${PB_VERSION}_linux_amd64.zip;
      fi &&
      ./pocketbase serve --http=0.0.0.0:8090
      "
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: volleyball_server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Переменные окружения для подключения к PocketBase внутри Docker
      - DB_PROVIDER=pocketbase
      - POCKETBASE_URL=http://pocketbase:8090
      - POCKETBASE_ADMIN_EMAIL=supervisor@volleyball.local
      - POCKETBASE_ADMIN_PASSWORD=Mer1in00
      - PORT=3000
      - ALLOWED_ORIGINS=*
    depends_on:
      pocketbase:
        condition: service_healthy

volumes:
  pb_data:
    driver: local