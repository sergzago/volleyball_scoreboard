version: '3.8'

services:
  # Сервис PocketBase (аналогично вашему существующему docker-compose.yml)
  pocketbase:
    image: ghcr.io/pocketbase/pocketbase:latest
    container_name: volleyball_pb_mobile
    restart: unless-stopped
    command: serve --http="0.0.0.0:8090" --origins="*"
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb_data
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8090/api/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 5

  # Сервис для мобильного интерфейса (фронтенд)
  frontend:
    image: nginx:alpine
    container_name: volleyball_frontend
    restart: unless-stopped
    ports:
      - "8080:80" # Мобильный интерфейс будет доступен на http://localhost:8080
    volumes:
      - ./:/usr/share/nginx/html:ro # Монтируем текущую директорию в Nginx
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro # Используем нашу конфигурацию

volumes:
  pb_data:
    driver: local